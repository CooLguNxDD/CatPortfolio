# Shared security headers — included at server level and inside every nested
# location that sets its own `add_header` (nginx does not inherit add_header
# from a parent scope once a child block declares one of its own; without
# this include, the static-asset and config.json locations silently drop
# nosniff / X-Frame-Options / Referrer-Policy / CSP).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# `unsafe-eval` stays: d3 (bundled transitively by the lazy mermaid chunk,
# see MermaidDiagram.tsx / src/blocks) uses `new Function(...)` for its DSV
# parser fast path. Confirmed via `grep -rl "new Function(" node_modules/d3*`
# on 2026-08-19; dropping unsafe-eval needs a full browser smoke test across
# the mermaid/archDiagram block before it can be tightened (review item 7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; worker-src 'self' blob:; frame-ancestors 'self';" always;
