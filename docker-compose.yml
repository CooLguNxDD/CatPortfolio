services:
  catportfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner          # build the final nginx stage
    container_name: catportfolio
    restart: unless-stopped
    ports:
      - "11000:8080"          # access the site at http://localhost:11000
    env_file:
      - .env                  # gitignored; see .env.example (OCT_BASE_URL, OCT_API_KEY, OCT_ASK_TIMEOUT_MS)
    environment:
      - NODE_ENV=production
      - OCT_BASE_URL=${OCT_BASE_URL:-}
      - OCT_API_KEY=${OCT_API_KEY:-}
      - OCT_ASK_TIMEOUT_MS=${OCT_ASK_TIMEOUT_MS:-600000}

  # ── Optional: local dev server (hot-reload, no build step) ──────────────────
  catportfolio-dev:
    image: node:22-alpine
    container_name: catportfolio-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules      # anonymous volume so host node_modules are isolated
    ports:
      - "11000:11000"          # Vite dev/preview port
    environment:
      - NODE_ENV=development
    command: sh -c "npm ci && npm run dev -- --host"
    profiles:
      - dev                    # only starts with: docker compose --profile dev up
