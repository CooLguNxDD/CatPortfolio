name: deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # OCT_API_KEY and OCT_BASE_URL must be set in GitHub → Settings → Secrets → Actions.
          # Vite bakes both into the JS bundle at build time (standard SPA pattern for
          # GitHub Pages — no server-side injection is available there).
          # The key is deny-all-scoped; the URL omission from config.json prevents
          # casual discovery even if the bundle is inspected.
          VITE_OCT_API_KEY: ${{ secrets.OCT_API_KEY }}
          VITE_OCT_URL: ${{ secrets.OCT_BASE_URL }}

      - name: Copy index.html to 404.html (SPA deep-link fallback)
        run: |
          test -f dist/index.html || { echo "dist/index.html missing after build" >&2; exit 1; }
          cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
