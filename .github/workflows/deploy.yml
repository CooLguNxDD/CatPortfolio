name: release-deploy

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # OCT_BASE_URL is set in GitHub → Settings → Secrets → Actions (points to Cloudflare Worker proxy).
          # VITE_OCT_API_KEY is intentionally empty — the Cloudflare Worker proxy injects
          # Authorization at the edge so no secret is exposed in the client bundle.
          VITE_OCT_API_KEY: ""
          VITE_OCT_URL: ${{ secrets.OCT_BASE_URL }}

      - name: Copy index.html to 404.html (SPA deep-link fallback)
        run: |
          test -f dist/index.html || { echo "dist/index.html missing after build" >&2; exit 1; }
          cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
