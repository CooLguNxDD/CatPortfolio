        - label: OpenCat Tunnel (personal OSS)
          href: https://github.com/CooLguNxDD/OpenCat-Mcp-Full
        - label: CatPortfolio (this site)
          href: https://github.com/CooLguNxDD/CatPortfolio

  - type: kpiGrid
    id: kpi-master
    props:
      items:
        - label: WelTel AWS bill
          value: "$4k → $2.8k"
