              cite: "Andrew Liang"
            - kind: metric
              label: Indexed job reports
              value: "4 tracks"
              delta: AI · DevOps · Mobile · Platform

  - type: starStory
    id: st1
    props:
      situation: >-
        At WelTel, cloud spend exceeded $4k/mo, mobile needed a real foundation,
        and clinicians lacked a safe AI tool surface over live clinical APIs.
      task: >-
        Drive DevOps cost/runner work, ship mobile chat infrastructure, and build
        the AI layer (MCP + Command Center) without conflating personal OSS projects.
      action: >-
        Self-hosted runners and Terraform multi-AZ; RN + Amplify GraphQL; WelTel MCP
