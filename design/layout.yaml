          spark: [4200, 3800, 3200, 2800]
        - label: WelTel clinical MCP tools
          value: 42 tools
          delta: Job AI gateway
          spark: [10, 22, 35, 42]
        - label: WelTel DevOps commits
          value: 570+ commits
          delta: Deploy + Terraform track
          spark: [100, 280, 430, 570]
        - label: WelTel Mobile commits
          value: 531+ commits
          delta: 39+ tickets · ~9 months
          spark: [80, 210, 380, 531]

  - type: flowAnim
    id: fa1
    props:
      title: OpenCat Tunnel (personal OSS) — tool routing & multi-provider agents
      animate: true
      nodes:
        - id: client
          label: Console / CLI
          group: client
        - id: gateway
          label: OpenCat MCP
          group: infra
        - id: router
          label: GOAP + embeddings
          group: core
        - id: tool
          label: Plugin tools
          group: exec
      edges:
        - from: client
          to: gateway
          label: natural language
        - from: gateway
          to: router
          label: plan / hybrid search
        - from: router
          to: tool
          label: scoped ops
        - from: tool
          to: client
