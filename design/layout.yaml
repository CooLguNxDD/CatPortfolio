# Source of truth for the portfolio layout.
# Edit this file (human or agent), then run: npm run compile:layout
# CI verifies sync via: npm run check:layout — never generates.

version: 1
theme: cozy
meta:
  audience: default
  generatedAt: "2026-08-03T06:30:00Z"
  # Streams: WelTel JOB work (employer) ≠ OpenCat Tunnel OSS ≠ CatPortfolio SPA.
  # Open Design matrix contract — one horizontal band = one topological level.
  dag:
    levels:
      - level: 0
        label: Intro
        at: 0
        nodes: [h1]
      - level: 1
        label: Impact
        at: 0.12
        nodes: [kpi-master]
      - level: 2
        label: WelTel job tracks
        at: 0.28
        nodes: [card-ai, card-devops, card-mobile, card-platform]
      - level: 3
        label: Personal OSS · OpenCat Tunnel
        at: 0.42
        nodes: [fa1, mcp-sandbox]
      - level: 4
        label: Charts · AWS cost (WelTel)
        at: 0.55
        nodes: [cost-sim, chart-master, comp-master]
      - level: 5
        label: Proof
        at: 0.68
        nodes: [timeline-master, st1]
      - level: 6
        label: Deep dive
        at: 0.8
        cols: 1
        nodes: [composite-master, a1, c1, pr1]
      - level: 7
        label: Ask
        at: 0.92
        nodes: [cta-quick]

