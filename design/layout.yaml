        - kind: stack
          gap: sm
          children:
            - kind: quote
              text: "Building the engine room and the clinician experience: from cloud cost optimization and self-hosted runners to 42-tool AI streaming gateways."
              cite: "Andrew Liang — Systems & AI Architect"
            - kind: metric
              label: Infrastructure Volume
              value: "1,600+ Commits"
              delta: Across 6 Repositories

  - type: starStory
    id: st1
    props:
      situation: WelTel's cloud costs exceeded $4,000/mo, mobile had no infrastructure, and clinical tools lacked unified AI integration.
      task: Overhaul cloud pipelines, build the mobile app from scratch, and architect a multi-provider AI gateway over 42 clinical tools.
      action: Deployed self-hosted EKS runners, refactored 570+ DevOps lines, built React Native app (531+ commits), and authored WelTel MCP server (395+ commits).
      result: Reduced AWS expenditure to $2,800/mo (-30% savings), delivered production mobile chat, and launched Clinician AI Command Center with streaming status.
