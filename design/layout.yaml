      kind: mermaid
      source: |-
        flowchart LR
          oct[OpenCat Tunnel OSS] --> bake[bake layout / MCP tools]
          bake --> api[public layout API]
          spa[CatPortfolio SPA] --> api
          spa --> ask["/ask live GenUI"]
          ask --> oct
          job[WelTel job reports] -.->|context only| oct

  - type: codeSnippet
    id: c1
    props:
      lang: ts
      caption: CatPortfolio — job layout fetch (personal OSS SPA talking to OpenCat Tunnel)
      code: |-
        // loadJobLayout(shortId) → GET /api/portfolio/public/layout/{id}
        // Backend bakes from portfolio projects (e.g. WelTel job tracks) + fragments.
        export async function loadJobLayout(jobId: string) {
          const res = await fetch(`${octBaseUrl()}/api/portfolio/public/layout/${jobId}`);
          if (!res.ok) return loadBaked(); // fail-open to default matrix
          return LayoutSchema.parse(await res.json());
        }

  - type: prose
    id: pr1
    props:
      markdown: |-
        ## How the streams fit

        **WelTel job work** (AI, DevOps, mobile, platform) is employer impact — sourced from contribution reports under `weltelprojects/`.

        **OpenCat Tunnel** is a **personal OSS** MCP platform (LangGraph, OAuth, plugins, portfolio bake). It is not WelTel product code.

        **CatPortfolio** is this **agentic portfolio SPA**: Zod layout contract, matrix `meta.dag`, live `/ask`, and `?j=` baked resumes.

        | Stream | Kind | Headline |
        | --- | --- | --- |
        | WelTel AI / DevOps / Mobile / Platform | Job | 42 tools · −30% AWS · 531+ mobile commits · SMS Axios |
        | OpenCat Tunnel | Personal OSS | MCP gateway platform + agent runtime |
        | CatPortfolio | Personal OSS | Matrix GenUI portfolio you are reading |

  - fragment: cta.quickActions
