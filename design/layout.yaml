      links:
        - label: GitHub Profile
          href: https://github.com/CooLguNxDD
        - label: OpenCat Tunnel Repo
          href: https://github.com/CooLguNxDD/Weltel-Mcp-Full
        - label: CatPortfolio Repo
          href: https://github.com/CooLguNxDD/CatPortfolio

  - type: kpiGrid
    id: kpi-master
    props:
      items:
        - label: AWS Bill Reduction
          value: "$4k → $2.8k"
          delta: "-30% monthly savings"
          spark: [4200, 3800, 3200, 2800]
        - label: Clinical MCP Tools
          value: 42 tools
          delta: Real-time API bindings
          spark: [10, 22, 35, 42]
        - label: DevOps Commits
          value: 570+ commits
          delta: Across 4 repos
          spark: [100, 280, 430, 570]
        - label: Mobile Commits
          value: 531+ commits
          delta: 39+ Jira tickets
          spark: [80, 210, 380, 531]

  - type: flowAnim
    id: fa1
    props:
      title: OpenCat Vector Tool Routing & Multi-Provider AI Architecture
      animate: true
      nodes:
        - id: client
          label: Clinician UI
          group: client
        - id: gateway
          label: MCP Gateway
          group: infra
        - id: router
          label: pgvector Router
          group: core
        - id: tool
          label: 42 Tools
          group: exec
      edges:
        - from: client
          to: gateway
          label: natural language prompt
        - from: gateway
          to: router
          label: cosine search (1536 dim)
        - from: router
          to: tool
          label: 2-3 narrowed tools
        - from: tool
          to: client
          label: streaming answer

