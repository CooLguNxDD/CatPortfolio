        - kind: stack
          gap: sm
          children:
            - kind: text
              markdown: |-
                ### Personal OSS
                - **OpenCat Tunnel** — LangGraph, OAuth, plugins, GOAP MCP platform.
                - **CatPortfolio** — React 19 matrix GenUI, live `/ask`, bake `?j=`.
