      kind: mermaid
      source: |-
        flowchart LR
          oct[WelTel MCP Server / 42 Tools] --> layout[layout.json]
          layout --> gate[Commit Gate & CI]
          gate --> action[GitHub Action / Self-Hosted Runner]
          action --> pages[GitHub Pages]
          spa[CatPortfolio SPA] --> live[live OCT]
          live --> fallback[fallback snapshot]
          fallback --> baked[baked layout]

  - type: codeSnippet
    id: c1
    props:
      lang: ts
      caption: Multi-Provider AI Provider Dispatcher & Streaming Engine (welTel-mono)
      code: |-
        export async function streamClinicianAssistant({ prompt, provider = "antigravity" }: StreamRequest) {
          const mcpTools = await octClient.listTools(); // 42 clinical tools
          const engine = provider === "grok" ? xAiGrok : provider === "antigravity" ? googleAntigravity : openAI;
          return engine.chatStream({
            messages: [{ role: "user", content: prompt }],
            tools: mcpTools,
            onProgress: (step) => emitProgressPill(step),
          });
        }

  - type: prose
    id: pr1
    props:
      markdown: |-
        ## How this system powers WelTel's software delivery

        By coupling **AWS cloud cost optimization (-30% bill reduction)** with an **AI-driven Model Context Protocol (MCP) gateway**, WelTel's engineering stack operates with zero vendor lock-in, automated CI/CD pipelines, and real-time clinical intelligence.

        - **DevOps**: Self-hosted AWS EKS runners & multi-AZ VPC layout.
        - **AI & MCP**: 42 clinical tools, Google Antigravity & xAI Grok streaming.
        - **Mobile**: AWS Amplify GraphQL real-time chat & 5 modernized SMS gateways.

        | Infrastructure Area | Metric | Achievement |
        | --- | --- | --- |
        | Cloud Infrastructure | $4,000 → $2,800/mo | -30% AWS Monthly Bill Reduction |
        | AI Gateway | 42 Tools | Greenfield MCP Protocol Server (~395 commits) |
        | Mobile App | 531+ Commits | Production React Native + Amplify GraphQL |
        | Platform SMS | 5 Gateways | Refactored deprecated request to Axios |

  - fragment: cta.quickActions
