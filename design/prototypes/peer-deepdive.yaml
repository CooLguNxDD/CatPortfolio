      caption: Zod Layout Block validation (CatPortfolio self-rendering loop)
      code: |-
        import { z } from "zod";

        export const CardBlock = z.object({
          type: z.literal("card"),
          id: z.string(),
          props: z.object({
            title: z.string().optional(),
            eyebrow: z.string().optional(),
            body: z.string().optional(),
            domain: z.enum(["ai", "devops", "mobile", "platform"]).optional(),
            tech: z.string().optional(),
            metrics: z.array(z.object({ label: z.string(), value: z.string() })).optional()
          })
        });

  - type: prose
    id: adr-prose
    props:
      markdown: |-
        ## Architectural Decision Records (ADRs)

        ### ADR-01: AI/MCP — Custom pgvector Semantic Router vs. Monolithic REST Wrappers

        * **Context:** WelTel's 42 clinical capabilities exceed context constraints on LLM agent endpoints.
        * **Decision:** Embed tools inside `pgvector`, retrieve top matching tools using cosine similarity, and invoke FastMCP nodes on demand.
        * **Consequence:** Gateway remains provider-agnostic. Prompts stay clean and fast. Specialist sub-agents handle heavy analysis.

        ### ADR-02: DevOps — Self-Hosted EKS Runners vs. SaaS Builders

        * **Context:** High organization hosting bills ($4k/mo+) and developer runner queue latency.
        * **Decision:** Shift Dockerized pipelines to self-hosted Kubernetes EKS runner node groups using Terraform.
        * **Consequence:** Decreased monthly cloud spend to $2,800 (-30%) while doubling deployment caching speeds.
