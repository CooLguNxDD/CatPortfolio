# Nginx config for a Vite SPA built with base: /CatPortfolio/
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare paths to the Vite base path
    location = / {
        return 301 /CatPortfolio/;
    }

    location = /CatPortfolio {
        return 301 /CatPortfolio/;
    }

    # Serve the SPA and static assets under the Vite base path.
    # Built files live at html root; alias maps /CatPortfolio/* → html/*
    location /CatPortfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /CatPortfolio/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}