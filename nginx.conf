# Nginx config for a Vite SPA built with base: /CatPortfolio/
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare paths to the Vite base path. $is_args$args preserves the
    # query string (e.g. ?j=<short_id>) — a bare "/CatPortfolio/" target drops
    # it silently on a 301, so any job-layout link hitting the root ("/") lost
    # its ?j= param on redirect. $http_host (not $host) also preserves the
    # port the client actually connected on ($host strips it) — a relative
    # "/CatPortfolio/..." target let nginx auto-build the Location header from
    # $host, so a local docker-port-mapped access (e.g. localhost:11000)
    # redirected to plain "localhost" on port 80, which nothing listens on.
    location = / {
        return 301 $scheme://$http_host/CatPortfolio/$is_args$args;
    }

    location = /CatPortfolio {
        return 301 $scheme://$http_host/CatPortfolio/$is_args$args;
    }

    # Serve the SPA and static assets under the Vite base path.
    # Built files live at html root; alias maps /CatPortfolio/* → html/*
    location /CatPortfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /CatPortfolio/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}