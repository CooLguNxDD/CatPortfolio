# Nginx config for CatPortfolio SPA (base: /CatPortfolio/)
# Proxies /api and /mcp to the host OpenCat server so the browser always
# talks same-origin (localhost:11000 or ngrok) — no CORS, no public→loopback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # OpenCat public REST (job layouts, layout-for-query, compose, …)
    location /api/ {
        proxy_pass http://host.docker.internal:10000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MCP Streamable HTTP (Ask / run_graph)
    location /mcp {
        proxy_pass http://host.docker.internal:10000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = / {
        return 301 /CatPortfolio/$is_args$args;
    }

    location = /CatPortfolio {
        return 301 /CatPortfolio/$is_args$args;
    }

    location /CatPortfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /CatPortfolio/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Runtime config at site root (loadRuntimeConfig fetches /config.json)
    location = /config.json {
        alias /usr/share/nginx/html/config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
