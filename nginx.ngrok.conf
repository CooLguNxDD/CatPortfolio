# Nginx config template for CatPortfolio SPA (base: /CatPortfolio/)
# ⚠ This file is a template — docker-entrypoint.sh runs:
#       envsubst '${OCT_BASE_URL}${OCT_API_KEY}' < default.conf.template > default.conf
#   Both ${OCT_BASE_URL} and ${OCT_API_KEY} are substituted at container start.
#   The resulting default.conf is the live config; neither the backend URL nor
#   the API key ever appear in any browser-visible resource.
#
# Proxies /api and /mcp to the host OpenCat server so the browser always
# talks same-origin (localhost:11000 or ngrok) — no CORS, no public→loopback.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # OpenCat public REST (job layouts, layout-for-query, compose, …)
    location /api/ {
        proxy_pass ${OCT_BASE_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MCP Streamable HTTP (Ask / run_graph)
    # Authorization is injected here by nginx from OCT_API_KEY (see
    # docker-entrypoint.sh + envsubst).  Any Authorization header the
    # browser might send is explicitly cleared first so it cannot be
    # used to supply a different token.
    location /mcp {
        proxy_pass ${OCT_BASE_URL}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Clear any browser-supplied Authorization, then inject the server-side key.
        proxy_set_header Authorization "";
        proxy_set_header Authorization "Bearer ${OCT_API_KEY}";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = / {
        return 301 /CatPortfolio/$is_args$args;
    }

    location = /CatPortfolio {
        return 301 /CatPortfolio/$is_args$args;
    }

    location /CatPortfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /CatPortfolio/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            include /etc/nginx/snippets/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Runtime config at site root (loadRuntimeConfig fetches
    # `${BASE_URL}config.json`, i.e. /CatPortfolio/config.json under the SPA
    # base path). The base-path location is primary; the bare /config.json
    # alias is kept as a fallback for any caller that hits the origin root.
    # Contains only non-secret values (askTimeoutMs).
    # octBaseUrl and mcpApiKey are intentionally absent — both live in nginx only.
    location = /CatPortfolio/config.json {
        alias /var/cache/nginx/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location = /config.json {
        alias /var/cache/nginx/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
